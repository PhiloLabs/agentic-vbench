category = "video-super-resolution-shot"
tags = ["super-resolution", "shot-scoped", "4x-downsample", "video-restoration"]
source = "27-sr-4x-wrights-law.mp4"
corruption = "shot-scoped SR: target shot [655, 792] in 60s clip downsampled 4× (bicubic) then re-upsampled bicubic to 1280×720; agent must localise + restore"
