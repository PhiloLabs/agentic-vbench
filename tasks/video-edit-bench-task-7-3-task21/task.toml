version = "1.0"

[task]
name = "agentic-vbench/video-edit-bench-task-7-3-task21"

[metadata]
difficulty = "medium"
category = "video-editing"
tags = ["video-assembly", "video-edit-bench", "task-7-3"]
source = "ameddserM/video_edit_bench_task_7_3 (row task_id=21)"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true

# HF_TOKEN is required for these tasks — materials live in the gated
# `_task_7` HF dataset. Harbor resolves ${HF_TOKEN} from the host's
# environment at trial start. Empty default keeps the suite parseable
# if the dataset becomes public later.
[environment.env]
HF_TOKEN = "${HF_TOKEN:-}"

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
timeout_sec = 600.0
