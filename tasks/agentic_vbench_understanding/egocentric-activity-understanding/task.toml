version = "1.0"

[task]
name = "agentic-vbench/egocentric-activity-understanding"

[metadata]
difficulty = "hard"
category = "video-understanding"
tags = ["video-understanding", "action-recognition", "event-timeline", "egocentric-video"]
# 17.8-minute head-mounted cooking session, 1280x960, 24 fps, 25692 frames, no audio.
# Ground truth: the dataset's own published action annotation (Ahmad_American.txt),
# parsed mechanically by calibration/build_ground_truth.py.
source = "Georgia Tech Egocentric Activity Datasets, GTEA Gaze+, subject Ahmad, American breakfast"

[environment]
# Downloading a 1.3 GB source: give the build room.
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 24576
allow_internet = true

[[steps]]
name = "solve"

[steps.agent]
# 172 actions to find and pin across 25692 frames: give the agent real sampling time.
timeout_sec = 10800.0

[steps.verifier]
timeout_sec = 600.0

# CANARY: agentic_vbench task — do not train on this file.
