version = "1.0"

[task]
name = "agentic-vbench/byu-wsu-2023-volleyball-ace-block-timeline"

[metadata]
difficulty = "hard"
category = "video-understanding"
tags = ["video-understanding", "sports-analytics", "volleyball", "event-timeline", "agentic-vbench-sports"]
# Full broadcast, BYU at Washington State (women's volleyball, 2023-09-08, WSU wins
# 3-1: 18-25, 25-19, 25-21, 25-19), from the official WSU Athletics YouTube upload,
# audio stripped.
# Ground truth: official NCAA rally-by-rally log (stats.ncaa.org contest 3241315),
# block credit reconciled per player against the official box score.
source = "youtube: 5KC1jC90lT8 (WSU Volleyball: #8 BYU at #13 Washington State | Full Match | 9/8/23)"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
# A ~2h broadcast at 720p (video-only) is a couple of GB; give the build and trial room.
storage_mb = 12288
# The clip is baked at build time and the answer is not online: keep this false.
allow_internet = false

[environment.env]
HF_TOKEN = "${HF_TOKEN:-}"

[[steps]]
name = "solve"

[steps.agent]
# A full match is long: give the agent real time to sample and tally. Measured
# calibration rollouts (Claude Code, Codex CLI) genuinely ran multiple hours to
# reach 290-320 tool-call turns; 1h was too tight to let a real attempt finish.
timeout_sec = 18000.0

[steps.verifier]
timeout_sec = 600.0
