version = "1.0"

[task]
name = "agentic-vbench/kart-race-telemetry-ledger-s1"

[metadata]
difficulty = "medium"
category = "video-understanding"
tags = ["video-understanding", "game-analysis", "racing", "object-tracking", "long-horizon", "event-timeline", "synthetic-ground-truth", "agentic-vbench-understanding"]
# Twelve AI-driven SuperTuxKart races (~56 min total) on twelve tracks. The camera is a chase-cam
# locked to one hero kart (tux) throughout; the agent reconstructs TWO of the HERO's off-HUD quantities
# in each race — powerup boxes driven through, and drift seconds (yellow wheel-sparks, in VIDEO time)
# — neither shown as a number (powerup HUD masked), scored EXACTLY. (spin-outs are visible but NOT
# scored: too countable to be a difficulty lever.) Scoping to the camera-followed kart makes every
# scored event observable (the fairness fix for the reviewer's twelve-kart objection); the length +
# accurate off-HUD counting/timing are where the difficulty lives. GT is STK's own profile table, so
# the recorded run is its own machine-exact ground truth. Real-life framing: fine-grained event
# counting on a tracked subject across long gameplay/sports footage.
source = "synthetic: SuperTuxKart 1.5 --profile-laps --kart=tux (SuperTux AI difficulty), recorded under Xvfb; generator/ (run_suite.sh)"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 8192
allow_internet = false

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 3600.0

[steps.verifier]
timeout_sec = 600.0
