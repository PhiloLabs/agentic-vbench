version = "1.0"

[task]
name = "agentic-vbench/kart-race-telemetry-ledger-s1"

[metadata]
difficulty = "hard"
category = "video-understanding"
tags = ["video-understanding", "game-analysis", "racing", "multi-object-tracking", "long-horizon", "event-timeline", "synthetic-ground-truth", "agentic-vbench-understanding"]
# Six AI-driven SuperTuxKart races (41.5 min total), twelve karts each on six tracks. The agent
# counts, per kart, the powerup boxes it collected — that total is not displayed on screen,
# so it means following twelve karts and counting discrete events. GT is STK's own profile-mode
# result table, so the recorded run is its own machine-exact ground truth. Real-life framing:
# multi-object tracking plus fine-grained event counting in crowded gameplay/sports footage.
source = "synthetic: SuperTuxKart 1.5 --profile-laps (SuperTux AI difficulty), recorded under Xvfb; tools/p4_stk/"

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 8192
allow_internet = false

[environment.env]
HF_TOKEN = "${HF_TOKEN:-}"

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 3600.0

[steps.verifier]
timeout_sec = 600.0
